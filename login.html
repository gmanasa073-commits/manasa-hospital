<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MANASA MULTI SPECIALITY HOSPITAL</title>


    <style>

        /* ================= BASIC SETTINGS ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: #333;

            background: #f5f0df;
        }


        /* ================= FULL BACKGROUND ================= */

        .login-page {

            min-height: 100vh;

            background-image:

                linear-gradient(
                    rgba(20, 55, 40, 0.60),
                    rgba(20, 55, 40, 0.60)
                ),

                url("https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;

            background-position: center;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* ================= HEADER ================= */

        header {

            width: 100%;

            background: rgba(23, 60, 44, 0.96);

            color: white;

            padding: 20px;

            text-align: center;

            border-bottom: 3px solid #d4af37;
        }


        header h1 {

            font-size: 34px;

            letter-spacing: 1px;
        }


        .hospital-icon {

            font-size: 40px;

            margin-right: 10px;
        }


        /* ================= BACK TO HOME ================= */

        .home-button-container {

            width: 100%;

            padding: 20px 35px;
        }


        .home-button {

            display: inline-block;

            background: rgba(23, 60, 44, 0.95);

            color: white;

            text-decoration: none;

            padding: 11px 22px;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            border: 1px solid #d4af37;

            transition: 0.3s;
        }


        .home-button:hover {

            background: #d4af37;

            color: #173c2c;
        }


        /* ================= LOGIN CARD ================= */

        .login-card {

            width: 420px;

            max-width: 90%;

            background: rgba(255, 253, 247, 0.97);

            padding: 40px;

            border-radius: 20px;

            border: 2px solid #d4af37;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.40);

            text-align: center;

            margin-top: 20px;
        }


        /* ================= LOGIN ICON ================= */

        .login-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 15px;

            background: #285943;

            border: 4px solid #d4af37;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            color: white;
        }


        /* ================= LOGIN TITLE ================= */

        .login-card h2 {

            font-family: Georgia, serif;

            color: #285943;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .login-card .subtitle {

            color: #666;

            font-size: 15px;

            margin-bottom: 25px;
        }


        .gold-line {

            color: #c49b20;

            font-size: 18px;

            margin-bottom: 20px;
        }


        /* ================= FORM ================= */

        .form-group {

            text-align: left;

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            color: #285943;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 15px;
        }


        .form-group input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #c8c8c8;

            border-radius: 7px;

            font-size: 16px;

            outline: none;

            background: #fff;

            transition: 0.3s;
        }


        .form-group input:focus {

            border-color: #3b7959;

            box-shadow:
                0 0 5px rgba(59, 121, 89, 0.35);
        }


        /* ================= PASSWORD BOX ================= */

        .password-container {

            position: relative;
        }


        .password-container input {

            padding-right: 55px;
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #285943;

            cursor: pointer;

            font-size: 20px;

            padding: 0;
        }


        .show-password:hover {

            background: transparent;

            transform: translateY(-50%);
        }


        /* ================= OPTIONS ================= */

        .login-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 0 20px;

            font-size: 14px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 6px;

            color: #555;
        }


        .forgot {

            color: #285943;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;
        }


        .forgot:hover {

            color: #c49b20;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-button {

            width: 100%;

            padding: 14px;

            background: linear-gradient(
                135deg,
                #3b7959,
                #24533d
            );

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.20);
        }


        .login-button:hover {

            background: #173c2c;

            transform: translateY(-2px);
        }


        /* ================= REGISTER ================= */

        .register-text {

            margin-top: 22px;

            color: #555;

            font-size: 15px;
        }


        .register-text a {

            color: #285943;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {

            color: #c49b20;
        }


        /* ================= FOOTER ================= */

        footer {

            margin-top: auto;

            width: 100%;

            background: rgba(23, 60, 44, 0.96);

            color: white;

            text-align: center;

            padding: 15px;

            border-top: 2px solid #d4af37;

            font-size: 14px;
        }


        /* ================= ERROR MESSAGE ================= */

        #message {

            display: none;

            background: #f8d7da;

            color: #842029;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media screen and (max-width: 600px) {

            header h1 {

                font-size: 22px;
            }


            .hospital-icon {

                font-size: 28px;
            }


            .login-card {

                padding: 30px 22px;

                margin-top: 5px;
            }


            .home-button-container {

                padding: 15px;
            }


            .login-card h2 {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <div class="login-page">


        <!-- ================= HEADER ================= -->

        <header>

            <h1>

                <span class="hospital-icon">🏥</span>

                MANASA MULTI SPECIALITY HOSPITAL

            </h1>

        </header>


        <!-- ================= HOME BUTTON ================= -->

        <div class="home-button-container">

            <a href="index.html" class="home-button">

                ← Back to Home

            </a>

        </div>


        <!-- ================= LOGIN CARD ================= -->

        <div class="login-card">


            <div class="login-icon">

                👤

            </div>


            <h2>

                Patient Login

            </h2>


            <p class="subtitle">

                Login to access your hospital account

            </p>


            <div class="gold-line">

                ✦ ───────── ✦

            </div>


            <!-- ERROR MESSAGE -->

            <div id="message">

                Please enter your email and password.

            </div>


            <!-- ================= FORM ================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        Password

                    </label>


                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()">

                            👁

                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">


                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember">

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        onclick="forgotPassword()">

                        Forgot Password?

                    </a>


                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button">

                    🔐 Login

                </button>


            </form>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">

                    Create Account

                </a>

            </p>


        </div>
        <a href="home.html" class="home-button">
    ← Back to Home
</a>


        <!-- ================= FOOTER ================= -->

        <footer>

            © 2026 MANASA MULTI SPECIALITY HOSPITAL
            | All Rights Reserved

        </footer>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= LOGIN ================= */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                let email =
                    document.getElementById("email").value.trim();


                let password =
                    document.getElementById("password").value.trim();


                let message =
                    document.getElementById("message");


                if (email === "" || password === "") {

                    message.style.display = "block";

                    message.innerText =
                        "Please enter your email and password.";

                    return;

                }


                if (!email.includes("@")) {

                    message.style.display = "block";

                    message.innerText =
                        "Please enter a valid email address.";

                    return;

                }


                message.style.display = "none";


                alert(
                    "Login successful! Welcome to MANASA MULTI SPECIALITY HOSPITAL."
                );


                /*
                    After successful login,
                    open dashboard.html
                */

                window.location.href =
                    "dashboard.html";

            });



        /* ================= SHOW PASSWORD ================= */

        function togglePassword() {

            let password =
                document.getElementById("password");

            let button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";

                button.innerHTML = "🙈";

            }

            else {

                password.type = "password";

                button.innerHTML = "👁";

            }

        }



        /* ================= FORGOT PASSWORD ================= */

        function forgotPassword() {

            alert(
                "Please contact MANASA MULTI SPECIALITY HOSPITAL administration to reset your password."
            );

        }

    </script>


</body>

</html>
